name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      # No cgo anywhere: both binaries cross-compile from one runner.
      # Generated assets (styles.css, templ, sqlc, winres .syso) are
      # committed, so plain builds suffice.
      - run: GOOS=windows GOARCH=amd64 go build -ldflags='-s -w -H=windowsgui' -o dist/bender-windows-amd64.exe ./cmd/bender
      - run: GOOS=linux GOARCH=amd64 go build -ldflags='-s -w' -o dist/bender-linux-amd64 ./cmd/bender
      - run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
